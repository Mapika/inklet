name: Release checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  figures:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'
      - name: Install fonts and independent PDF renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core fonts-dejavu-extra fonts-noto-core fonts-liberation fonts-urw-base35 poppler-utils
          pdftoppm -v
      - name: Install the reviewed visual browser
        env:
          CHROME_VERSION: '145.0.7632.45'
          CHROME_SHA256: 6aed53fe777ca9a58a680b848a80022300566fb902424291e054984a784c73a2
        run: |
          curl --fail --location --retry 3 "https://dl.google.com/linux/chrome/deb/pool/main/g/google-chrome-stable/google-chrome-stable_${CHROME_VERSION}-1_amd64.deb" --output "$RUNNER_TEMP/chrome.deb"
          printf '%s  %s\n' "$CHROME_SHA256" "$RUNNER_TEMP/chrome.deb" | sha256sum --check
          dpkg-deb -x "$RUNNER_TEMP/chrome.deb" "$RUNNER_TEMP/visual-browser"
          mkdir -p "$RUNNER_TEMP/visual-browser/bin"
          ln -s ../opt/google/chrome/google-chrome "$RUNNER_TEMP/visual-browser/bin/google-chrome"
          echo "$RUNNER_TEMP/visual-browser/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/visual-browser/bin/google-chrome" --version
      - name: Install locked test dependencies
        run: |
          uv venv
          uv pip install -r requirements-ci.txt -e .
          .venv/bin/inklet doctor
      - name: Unit and integration tests
        run: .venv/bin/python -m pytest -q --junitxml=out/tests.xml
      - name: Generated API documentation
        run: .venv/bin/python tools/gen_api.py --check
      - name: Build documentation with strict link validation
        run: |
          uv pip install -r requirements-docs.txt
          .venv/bin/python -m mkdocs build --strict
          .venv/bin/python -m pytest -q tests/test_docs_site.py
      - name: Build the v2.5 publication review
        run: .venv/bin/inklet build examples/v25_document.py --output out/v25 --name document
      - name: Build the preset comparison gallery
        run: .venv/bin/python tools/preset_gallery.py --output out/presets
      - name: Common CSV plotting example
        run: .venv/bin/python examples/general_plots.py --output out/general-plots
      - name: Build the mathematical showcase library
        run: .venv/bin/python tools/showcase_gallery.py --plots-only --quality preview
      - name: Coordinated biology figure and data export
        run: .venv/bin/python examples/biology_panels.py --output out/biology
      - name: Complete figure visual regressions
        run: .venv/bin/python tools/visual_check.py --output out/visual
      - name: Complete figure performance checks
        run: .venv/bin/python tools/benchmark_v2.py --output out/benchmarks
      - name: Rendering engine workloads and quality review
        run: |
          .venv/bin/python tools/benchmark_engine.py --repeat 1 --output out/engine-benchmark.json
          .venv/bin/python examples/engine_review.py --output out/engine-review
      - name: Diagram routing and label review
        run: |
          .venv/bin/python tools/benchmark_diagrams.py --repeat 1 --output out/diagram-benchmark.json
          .venv/bin/python examples/diagram_review.py --output out/diagram-review
      - name: Twenty-panel mixed-media stress test
        run: .venv/bin/python tools/stress20.py --output out/stress20
      - name: Preserve review artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: figure-checks
          path: out/
          retention-days: 7
          if-no-files-found: ignore

  wheel:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ['3.11', '3.12', '3.13']
        include:
          - os: windows-2022
            python: '3.12'
          - os: macos-14
            python: '3.12'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install with core dependencies only
        run: |
          uv build --wheel --out-dir out/dist
          uv run --no-project python tools/check_wheel.py out/dist/inklet-*.whl
      - name: Install and check optional render extra
        run: uv run --no-project python tools/check_render_wheel.py out/dist/inklet-*.whl

  blender:
    name: Blender ${{ matrix.version }} CPU
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '4.2.23'
            series: '4.2'
            sha256: bea0eb3146be13eae6225409a117b215184f41b7f79e799f97cb3abb8f6dc404
          - version: '4.5.13'
            series: '4.5'
            sha256: da4e69b06b75b9e642d106496c50e7e240218b411d2f6e18271c1d1d819cef91
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'
      - name: Install Blender and test dependencies
        env:
          BLENDER_VERSION: ${{ matrix.version }}
          BLENDER_SERIES: ${{ matrix.series }}
          BLENDER_SHA256: ${{ matrix.sha256 }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 fonts-dejavu-core fonts-dejavu-extra
          archive="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          curl --fail --location --retry 3 "https://download.blender.org/release/Blender${BLENDER_SERIES}/${archive}" --output "$RUNNER_TEMP/$archive"
          printf '%s  %s\n' "$BLENDER_SHA256" "$RUNNER_TEMP/$archive" | sha256sum --check
          tar -xf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "INKLET_BLENDER=$RUNNER_TEMP/blender-${BLENDER_VERSION}-linux-x64/blender" >> "$GITHUB_ENV"
          uv venv
          uv pip install -r requirements-ci.txt -e .
      - name: Require the requested Blender build
        env:
          BLENDER_VERSION: ${{ matrix.version }}
        run: |
          .venv/bin/python -c 'import os; from inklet.three.blender import find_blender; assert find_blender().release == os.environ["BLENDER_VERSION"]'
      - name: Complete scenes, passes, projections, annotations and templates
        run: |
          .venv/bin/python -m pytest -q tests/test_blend_scene.py tests/test_scene_pass.py tests/test_scene_projection.py tests/test_scene_annotations.py tests/test_scene_templates.py tests/test_render_devices.py tests/test_render_jobs.py --junitxml=out/blender-tests.xml
      - name: Installed wheel creates and renders all templates
        run: |
          uv build --wheel --out-dir out/dist
          .venv/bin/python tools/check_render_wheel.py out/dist/inklet-*.whl --templates
      - name: Legacy vector line-art export integrity
        if: matrix.version == '4.2.23'
        run: .venv/bin/python -m pytest -q tests/test_three_blender.py
      - name: Preserve Blender test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blender-${{ matrix.version }}-checks
          path: out/blender-tests.xml
          retention-days: 7
