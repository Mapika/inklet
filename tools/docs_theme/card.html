<article class="gallery-card" data-category="{{ entry.category }}" data-title="{{ entry.title }} {{ entry.description }}">
  <a class="card-link" href="{{ entry.page|url }}" aria-label="{{ entry.title }}: view example">
    <div class="card-image"><img src="{{ entry.image|url }}" alt="" loading="lazy" width="640" height="480"></div>
    <div class="card-copy"><div class="card-meta"><span>{{ entry.category }}</span><span>{{ entry.version }}</span></div><h2>{{ entry.title }}</h2><p>{{ entry.description }}</p><div class="card-bottom">{% if entry.requires != entry.version %}<span>{{ entry.requires }}</span>{% endif %}<span class="card-action">View example →</span></div></div>
  </a>
</article>
