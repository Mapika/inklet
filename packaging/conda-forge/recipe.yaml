# conda-forge recipe draft, rattler-build v1 format (recipe.yaml).
# Source: the PyPI sdist for 4.6.0, with its sha256 from pypi.org/pypi/inklet/json.
# Submit as described in README.md next to this file.
schema_version: 1

context:
  name: inklet
  version: "4.6.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/72/02/b321c6ecd14b3df60e52524e0af49cc7a5466472966ad7889fe51882aa1f/inklet-4.6.0.tar.gz
  sha256: 6cc37420d747f4c3daa0910074aa60e11fb18ae2c7783b94d7cc9b5a12316250

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python >=3.11
    - pip
    - hatchling
  run:
    - python >=3.11
    - uharfbuzz >=0.39
    - fonttools >=4.53

tests:
  - python:
      imports:
        - inklet
      pip_check: true
  - script:
      - inklet --help

about:
  homepage: https://inklet.readthedocs.io
  repository: https://github.com/Mapika/inklet
  documentation: https://inklet.readthedocs.io/en/stable/
  license: MIT
  license_file:
    - LICENSE
    - THIRD_PARTY_NOTICES.md
    - LICENSES/*
  summary: Scientific figures with live data, measured layout, and consistent vector exports.

extra:
  recipe-maintainers:
    - Mapika
