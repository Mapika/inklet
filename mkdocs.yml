site_name: Inklet
site_url: !ENV [READTHEDOCS_CANONICAL_URL, 'https://inklet.readthedocs.io/en/latest/']
site_description: Scientific figures with live data, measured layout and vector exports.
repo_url: https://github.com/Mapika/inklet
repo_name: GitHub
edit_uri: ''
docs_dir: docs
site_dir: out/docs-site
theme:
  name: mkdocs
  custom_dir: tools/docs_theme
  search_index_only: true
  highlightjs: false
  color_mode: light
  user_color_mode_toggle: true
  navigation_depth: 2
plugins:
  - search
hooks:
  - tools/docs_site.py
extra:
  # Group labels shown in the sidebar before these top-level sections.
  nav_labels:
    Get started: Guides
    Gallery: Examples and reference
    Experimental: Previews and project notes
  # Plot-catalog titles shown on the home page, in this order. Titles not in
  # tools/plot_catalog.json are skipped.
  home_plots:
    - Dumbbells
    - Labelled points
    - Volcano plots
    - Cumulative distributions
    - Rainclouds
    - Dendrograms
    - Radar charts
    - Pie breakout bars
    - UpSet plots
    - Dot plots
    - Survival curves
    - Forest plots
    - Embedding scatters
    - Split violins
    - Significance brackets
  # One-line summaries shown above each family in the plot-type gallery.
  # Families come from the `category` field of tools/plot_catalog.json.
  plot_families:
    Lines and points: Ordered series, steps and scatter, with paired-value dumbbells, lollipops, labelled points, volcano plots and UMAP or t-SNE embedding scatters.
    Bars and areas: Grouped, stacked and horizontal bars with value labels, UpSet plots of set intersections, and areas between curves.
    Distributions: Histograms, boxplots, violins and split violins, swarms, cumulative distributions, ridgelines, rainclouds, Kaplan-Meier survival curves and stacked significance brackets.
    Uncertainty: Supplied bounds as bands and error bars, and forest plots of effect sizes with summary diamonds.
    Matrices: Heatmaps and dot plots with colour and size keys, and dendrograms that order the rows.
    Polar: Angle and radius, from polar curves and roses to radar charts, pies, donuts and breakout bars.
  # Pages built and searchable but left out of the sidebar. Each one belongs
  # to a section: the sidebar opens that section and search reports it. Every
  # page listed here must also be listed in not_in_nav below.
  unlisted:
    Diagrams:
      - diagram-engine.md
    3D and images:
      - scientific-scenes.md
      - open-anatomy.md
    Gallery:
      - general-plots.md
      - cohort-figure.md
      - biology-panels.md
      - complex-scene.md
      - recipes/interference.md
      - recipes/attractor.md
      - recipes/wave-packets.md
      - recipes/photonics.md
      - recipes/lattice.md
      - recipes/helix.md
      - recipes/architecture.md
      - recipes/architecture-sketch.md
    Experimental:
      - table-inputs.md
      - time-series.md
      - statistical-views.md
      - geographic-features.md
      - visual-editing.md
      - regional-report.md
      - world-map.md
      - engineering-report.md
      - scientific-report.md
      - mesh-fields.md
      - contours-streamlines.md
      - oblique-sections.md
      - slabs-and-regions.md
      - channels-and-contours.md
      - label-measurements.md
      - microscopy-tiff.md
      - real-biology.md
      - oblique-biology.md
      - slab-biology.md
      - fluorescence-biology.md
      - label-intensities.md
    Development:
      - history.md
      - development-preview.md
      - roadmap.md
      - acceptance.md
      - release-checks.md
      - brand.md
      - rendering-engine.md
      - plot-quality.md
      - compositing.md
      - hatching.md
      - clipping.md
      - compiled-scenes.md
      - marker-batches.md
      - marker-culling.md
      - design/v2.md
      - design/capability-gaps.md
      - design/docs-structure.md
extra_css:
  - stylesheets/code.css
  - stylesheets/inklet.css
extra_javascript:
  - javascripts/inklet.js
markdown_extensions:
  - admonition
  - fenced_code
  - codehilite:
      guess_lang: false
  - tables
  - toc:
      permalink: true
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn
