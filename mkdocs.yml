site_name: Inklet
site_url: !ENV [READTHEDOCS_CANONICAL_URL, 'https://inklet.readthedocs.io/en/latest/']
site_description: Scientific figures with live data, measured layout and vector exports.
repo_url: https://github.com/Mapika/inklet
repo_name: GitHub
edit_uri: ''
docs_dir: docs
site_dir: out/docs-site
theme:
  name: mkdocs
  custom_dir: tools/docs_theme
  highlightjs: false
  color_mode: light
  user_color_mode_toggle: true
  navigation_depth: 2
plugins:
  - search
hooks:
  - tools/docs_site.py
extra_css:
  - stylesheets/code.css
  - stylesheets/inklet.css
extra_javascript:
  - javascripts/inklet.js
markdown_extensions:
  - admonition
  - fenced_code
  - codehilite:
      guess_lang: false
  - tables
  - toc:
      permalink: true
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn
nav:
  - Overview: index.md
  - Get started:
      - Installation: installation.md
      - First figure: quickstart.md
      - Authoring model: concepts.md
  - Guides:
      - Presets: presets.md
      - Page layout: layout.md
      - Plotting: plotting.md
      - Live data: data.md
      - Diagrams: diagrams.md
      - 3D and images: three-images.md
      - Export and review: export-review.md
      - Troubleshooting: troubleshooting.md
  - Rendering:
      - Rendering in v3: v3.md
      - Blender scenes: blender-scenes.md
      - GPU rendering and jobs: render-jobs.md
  - Examples:
      - Figure gallery: examples.md
      - More example recipes: example-library.md
      - Rebuild the showcase: showcase.md
      - Figure recipes:
          - Interference: recipes/interference.md
          - Deterministic chaos: recipes/attractor.md
          - Travelling wave packets: recipes/wave-packets.md
          - Integrated photonics: recipes/photonics.md
          - Designed porosity: recipes/lattice.md
          - Paired helices: recipes/helix.md
          - Architectural interior: recipes/architecture.md
          - Architectural sketch: recipes/architecture-sketch.md
      - Twenty-panel stress test: stress20.md
      - Direct drawing cookbook: cookbook.md
  - Reference:
      - Python API: api.md
      - Command line: cli.md
      - Publication plots: publication-plots.md
      - Diagram components: diagram-components.md
  - Project:
      - Logo and brand assets: brand.md
      - Migration: migration.md
      - Version 2: v2.md
      - Version 2.5: v2.5.md
      - Release checks: release-checks.md
      - Compilation contract: design/v2.md
      - Historical grid study: design/page_grid.md
      - Contributing: https://github.com/Mapika/inklet/blob/master/CONTRIBUTING.md
      - Changelog: https://github.com/Mapika/inklet/blob/master/CHANGELOG.md
