site_name: Inklet
site_url: !ENV [READTHEDOCS_CANONICAL_URL, 'https://inklet.readthedocs.io/en/latest/']
site_description: Scientific figures with live data, measured layout and vector exports.
repo_url: https://github.com/Mapika/inklet
repo_name: GitHub
edit_uri: ''
docs_dir: docs
site_dir: out/docs-site
theme:
  name: mkdocs
  custom_dir: tools/docs_theme
  search_index_only: true
  highlightjs: false
  color_mode: light
  user_color_mode_toggle: true
  navigation_depth: 2
plugins:
  - search
hooks:
  - tools/docs_site.py
extra:
  # Group labels shown in the sidebar before these top-level sections.
  nav_labels:
    Start here: Guides
    Interactive documents (experimental): Previews
    Examples: Examples and reference
extra_css:
  - stylesheets/code.css
  - stylesheets/inklet.css
extra_javascript:
  - javascripts/inklet.js
markdown_extensions:
  - admonition
  - fenced_code
  - codehilite:
      guess_lang: false
  - tables
  - toc:
      permalink: true
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn
