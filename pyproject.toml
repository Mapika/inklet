[project]
name = "inklet"
version = "2.5.0"
description = "Scientific figures with live data, measured layout, and consistent vector exports."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
dependencies = [
    "uharfbuzz>=0.39",
    "fonttools>=4.53",
]

[project.urls]
Repository = "https://github.com/Mapika/inklet"
Documentation = "https://github.com/Mapika/inklet/blob/master/docs/index.md"
Issues = "https://github.com/Mapika/inklet/issues"

[project.scripts]
inklet = "inklet.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
docs = ["mkdocs>=1.6,<2", "pygments>=2.18,<3"]
# The image pipeline (inklet.asset): cutouts, silhouettes, line art, palette
# harmonisation. Deliberately not a base dependency -- drawing a box should not
# cost a raster stack. `rembg` and `potrace` stay out of even this extra: the
# first pulls in ONNX Runtime and downloads a ~180 MB model, the second is a
# system binary. Both are picked up automatically when present.
images = ["pillow>=10.0", "numpy>=1.24"]
# The 3D pipeline (inklet.model / inklet.solid) needs nothing at all: the parsers,
# the camera, hidden-line removal and the shading are standard library, and
# `inklet.solid("cube", width=20)` has to keep working on a cluster node with no
# network. This extra only *widens* it -- trimesh adds GLTF/COLLADA/3MF/OFF
# and the winding repair that anything downloaded wants. numpy is here for the
# optional Blender backend's raster tracing, not for the built-in renderer,
# which was measured and does not benefit (see inklet/three/deps.py).
three = ["trimesh>=4.0", "numpy>=1.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inklet"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests", "/docs", "/examples", "/figures", "/gallery",
    "/stress", "/tools", "/scripts", "/.github", "/.gitignore", "/.gitattributes",
    "/README.md", "/CONTRIBUTING.md", "/CHANGELOG.md", "/CONTRACT.md",
    "/LICENSE", "/THIRD_PARTY_NOTICES.md", "/mkdocs.yml",
    "/requirements-ci.txt", "/requirements-docs.txt",
]
