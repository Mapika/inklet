<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title><!--TITLE--></title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#253343;font:15px/1.5 system-ui,sans-serif}main{max-width:1500px;margin:auto;padding:24px}h1{font-size:22px;font-weight:600;margin:0 0 18px}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}button,select{font:inherit;padding:7px 12px;border:1px solid #bbc3cc;border-radius:5px;background:white;color:inherit}button{cursor:pointer}:focus-visible{outline:3px solid #2874a6;outline-offset:2px}#stage{width:100%;height:75vh;min-height:280px;background:white;border:1px solid #d3d8df;overflow:hidden;touch-action:none;cursor:grab}#stage>svg{display:block;width:100%;height:100%}#stage canvas{display:block;width:100%;height:100%}#status{font-size:13px;color:#506071}#error{color:#a02828}footer{margin-top:14px;font-size:13px;color:#506071}@media(max-width:650px){main{padding:12px}}
</style></head><body><main><h1><!--TITLE--></h1><div class="toolbar"><label>Renderer <select id="backend"><option value="auto">Automatic</option><option value="webgl2">WebGL2</option><option value="canvas">Canvas</option><option value="svg">SVG</option></select></label><button id="zoom-in">Zoom in</button><button id="zoom-out">Zoom out</button><button id="fit">Fit page</button><button id="download">Download vector SVG</button></div><div id="stage" tabindex="0" role="img" aria-label="Interactive figure. Drag to pan; use the zoom and fit controls."></div><p id="status" role="status"></p><p id="error" role="alert"></p><footer>Rendered from an Inklet compiled scene. Text and non-accelerated artwork remain SVG.</footer></main><script type="application/json" id="scene">/*SCENE*/</script><script>/*RUNTIME*/</script></body></html>
